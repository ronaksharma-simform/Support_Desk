services:
  db:
    image: postgres:16-alpine
    container_name: supportdesk-db
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports:
      - "5432:5432"
    volumes:
      - supportdesk_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  supportdesk_pgdata:
